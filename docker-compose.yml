services:
  db:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: vols
      POSTGRES_USER: vols
      POSTGRES_PASSWORD: vols
      VOLS_APP_PASSWORD: ${VOLS_APP_PASSWORD:-vols_app}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vols -d vols"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db-data:
